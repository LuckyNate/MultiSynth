<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Temporal Gnome</title><style>
:root{--blue:#55aaff;--blue2:#9ad0ff;--ink:#05070a;--panel:#0c1118;--line:#26384d;--text:#d9e8f6;--dim:#71869a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#122033 0,#070a0f 42%,#030405 100%);color:var(--text);font:14px ui-monospace,SFMono-Regular,Consolas,monospace;min-height:100vh}main{padding:18px;max-width:760px;margin:auto}.face{border:1px solid #30445c;border-radius:18px;background:linear-gradient(180deg,#111a25,#090d13);box-shadow:0 16px 50px #0009,inset 0 0 40px #55aaff0b;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0a1018,#101b29,#0a1018)}.brand small{display:block;color:var(--blue);letter-spacing:.32em;font-size:10px}.brand h1{margin:4px 0 0;font-size:28px;letter-spacing:.12em}.gnome{position:relative;width:72px;height:72px}.hat{position:absolute;left:24px;top:0;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:42px solid var(--blue);filter:drop-shadow(0 0 9px #55aaff66)}.faceDot{position:absolute;left:28px;top:35px;width:24px;height:24px;border-radius:50%;background:#c9d5df;border:4px solid #1d2b3b}.beard{position:absolute;left:20px;top:52px;width:40px;height:16px;border-radius:0 0 24px 24px;background:#dfe9ef}.syncBox{display:flex;align-items:center;gap:10px;margin:18px 20px 0;padding:12px 14px;border:1px solid #20354c;border-radius:12px;background:#07101b}.led{width:18px;height:18px;border-radius:50%;background:#102236;border:2px solid #2d4d6f;box-shadow:inset 0 0 6px #000;transition:background .04s,box-shadow .04s,transform .04s}.led.on{background:var(--blue2);box-shadow:0 0 8px var(--blue),0 0 22px var(--blue),0 0 42px #55aaff88;transform:scale(1.12)}.syncText b{display:block;letter-spacing:.18em}.syncText span{color:var(--dim);font-size:11px}.controls{padding:18px 20px 20px}.row{display:grid;grid-template-columns:120px 1fr 72px;gap:12px;align-items:center;margin:18px 0}.row span:first-child{letter-spacing:.12em;color:#bcd4e8}.row output{text-align:right;color:var(--blue2)}input[type=range]{width:100%;accent-color:var(--blue)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}button{border:1px solid #385675;border-radius:10px;padding:14px;background:#0b1521;color:var(--text);font:inherit;letter-spacing:.12em;box-shadow:inset 0 0 16px #55aaff08}button.active{background:#173554;border-color:var(--blue);box-shadow:0 0 18px #55aaff33,inset 0 0 18px #55aaff22}.foot{padding:14px 20px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.5}.pulseCount{margin-left:auto;color:var(--blue2)}
</style></head><body><main><section class="face"><div class="head"><div class="brand"><small>CASCADE TIMEKEEPER</small><h1>TEMPORAL GNOME</h1></div><div class="gnome" aria-hidden="true"><div class="hat"></div><div class="faceDot"></div><div class="beard"></div></div></div><div class="syncBox"><div id="syncLed" class="led"></div><div class="syncText"><b>SYNC PULSE</b><span>ACTUAL RACK CLOCK</span></div><div id="pulseCount" class="pulseCount">0000</div></div><div class="controls"><label class="row"><span>BPM</span><input id="bpm" type="range" min="30" max="300" value="120"><output>120</output></label><label class="row"><span>SWING</span><input id="swing" type="range" min="0" max="70" value="0"><output>0</output></label><label class="row"><span>DIVISION</span><input id="division" type="range" min="1" max="16" value="4"><output>4</output></label><label class="row"><span>CLICK LEVEL</span><input id="level" type="range" min="0" max="0.6" step="0.01" value="0.22"><output>0.22</output></label><div class="buttons"><button id="run">START CLOCK</button><button id="accent" class="active">DOWNBEAT ACCENT</button></div></div><div class="foot">The first active Temporal Gnome or other clock source upstream becomes master. Everything below it inherits the same tempo and phase.</div></section></main><script>(function(){const q=id=>document.getElementById(id),params=new URLSearchParams(location.search),instance=params.get('instance'),rack=params.get('rack');let flashes=0,offTimer=null;function emit(p){try{const P=parent.MultiSynth;if(instance&&rack&&P?.RackEngine){P.RackEngine.setModuleState(rack,instance,p);P.RackAudioGraph?.rebuild?.();return}}catch(_){}try{parent.postMessage({type:'multisynth-rack-state',patch:p},'*')}catch(_){}}for(const id of ['bpm','swing','division','level']){const e=q(id),o=e.nextElementSibling;e.oninput=()=>{o.textContent=id==='level'?Number(e.value).toFixed(2):e.value;emit({[id]:+e.value})}}q('run').onclick=()=>{const running=!q('run').classList.contains('active');q('run').classList.toggle('active',running);q('run').textContent=running?'STOP CLOCK':'START CLOCK';emit({running})};q('accent').onclick=()=>{const accent=!q('accent').classList.contains('active');q('accent').classList.toggle('active',accent);emit({accent})};function pulse(detail){if(instance&&detail?.instanceId&&detail.instanceId!==instance)return;flashes++;q('pulseCount').textContent=String(flashes%10000).padStart(4,'0');q('syncLed').classList.add('on');if(offTimer)clearTimeout(offTimer);offTimer=setTimeout(()=>q('syncLed').classList.remove('on'),70)}try{parent.addEventListener('multisynth-temporal-gnome-tick',e=>pulse(e.detail))}catch(_){}try{const s=parent.MultiSynth?.ModuleContract?.getRuntime?.(instance)?.state;if(s){for(const id of ['bpm','swing','division','level'])if(s[id]!=null){q(id).value=s[id];q(id).nextElementSibling.textContent=id==='level'?Number(s[id]).toFixed(2):s[id]}q('run').classList.toggle('active',!!s.running);q('run').textContent=s.running?'STOP CLOCK':'START CLOCK';q('accent').classList.toggle('active',s.accent!==false)}}catch(_){};})();</script></body></html>
