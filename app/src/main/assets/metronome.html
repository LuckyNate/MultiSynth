<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Metronome</title><style>body{margin:0;background:#111;color:#ddd;font:14px monospace}main{padding:18px;max-width:700px;margin:auto}h1{letter-spacing:.16em}section{border:1px solid #555;padding:16px;margin:12px 0}label{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;margin:14px 0}input{width:100%}button{background:#222;color:#eee;border:1px solid #888;padding:12px 18px;font:inherit}.active{background:#ddd;color:#111}.status{opacity:.7}</style></head><body><main><h1>METRONOME</h1><div class="status">RACK MASTER CLOCK</div><section><label>BPM <input id="bpm" type="range" min="30" max="300" value="120"><output>120</output></label><label>SWING <input id="swing" type="range" min="0" max="70" value="0"><output>0</output></label><label>DIVISION <input id="division" type="range" min="1" max="16" value="4"><output>4</output></label><label>CLICK LEVEL <input id="level" type="range" min="0" max="0.6" step="0.01" value="0.22"><output>.22</output></label><button id="run">START</button><button id="accent" class="active">ACCENT</button></section><p>When this is the first active clock in a cascade, all timing-capable modules below it inherit this clock and phase.</p></main><script>(function(){const q=id=>document.getElementById(id);function emit(p){parent.postMessage({type:'multisynth-rack-state',patch:p},'*')}for(const id of ['bpm','swing','division','level']){const e=q(id),o=e.nextElementSibling;e.oninput=()=>{o.value=e.value;o.textContent=e.value;emit({[id]:+e.value})}}q('run').onclick=()=>{const on=!q('run').classList.toggle('active');const running=q('run').classList.contains('active');q('run').textContent=running?'STOP':'START';emit({running})};q('accent').onclick=()=>{const accent=!q('accent').classList.contains('active');q('accent').classList.toggle('active',accent);emit({accent})};addEventListener('message',e=>{const s=e.data?.state;if(e.data?.type!=='multisynth-rack-load'||!s)return;for(const id of ['bpm','swing','division','level'])if(s[id]!=null){q(id).value=s[id];q(id).nextElementSibling.textContent=s[id]}q('run').classList.toggle('active',!!s.running);q('run').textContent=s.running?'STOP':'START';q('accent').classList.toggle('active',s.accent!==false)});})();</script></body></html>
