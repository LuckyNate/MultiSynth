<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Rearranger · MultiSynth</title>
<link rel="stylesheet" href="rearranger.css">
<link rel="stylesheet" href="rackbuilder.css">
</head>
<body>
<main class="rearrangerApp">
  <header class="hero">
    <div><div class="eyebrow">MULTISYNTH META TOOL</div><h1>THE REARRANGER</h1><p>Build arrangements from saved cascades and nested arrangements.</p></div>
    <div class="heroActions"><button id="arrangementUpBtn" type="button">↑ ARRANGEMENTS</button><button id="addCascadeBtn" type="button">+ ADD CASCADE</button><button id="addArrangementBtn" type="button">+ ADD ARRANGEMENT</button></div>
  </header>
  <section class="cascadeBank">
    <div class="bankHead"><strong>ARRANGEMENT</strong><span>ALWAYS SAVED</span></div>
    <div id="cascadeSlots" class="cascadeSlots"></div>
  </section>
</main>
<div id="cascadeChooser" class="moduleChooser hidden"><div class="moduleChooserPanel"><div class="moduleChooserHead"><strong>ADD CASCADE</strong><button id="closeCascadeChooser" type="button">CLOSE</button></div><div id="cascadeChoices" class="moduleChoices"></div></div></div>
<div id="arrangementChooser" class="moduleChooser hidden"><div class="moduleChooserPanel"><div class="moduleChooserHead"><strong>ADD ARRANGEMENT</strong><button id="closeArrangementChooser" type="button">CLOSE</button></div><div id="arrangementChoices" class="moduleChoices"></div></div></div>
<script src="hierarchy-library.js"></script>
<script src="rearranger.js"></script>
</body>
</html>
