<!doctype html>
<html lang="en" data-module-type="rearranger">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Rearranger</title>
  <link rel="stylesheet" href="module-instrument-editor.css">
  <link rel="stylesheet" href="control-surface.css">
  <link rel="stylesheet" href="control-performance-keyboard.css">
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">MULTISYNTH · MODULE</div>
      <h1>REARRANGER</h1>
      <p id="desc">CONTEXTUAL ARRANGEMENT CONTROLLER</p>
    </header>

    <section id="scopeShell" class="scopeShell" aria-label="Rearranger scope">
      <div class="scopeBezel">
        <canvas id="moduleScope"></canvas>
        <span class="scopeLabel">OUTPUT</span>
      </div>
    </section>

    <section id="controls" aria-label="Rearranger controls"></section>
  </main>

  <section id="performanceKeyboard"></section>

  <script src="control-surface-library.js"></script>
  <script src="control-surface-spec.js"></script>
  <script src="control-surface-renderer.js"></script>
  <script src="control-keyboard.js"></script>
  <script src="module-output-scope.js"></script>
  <script src="rearranger-ui.js"></script>
</body>
</html>
