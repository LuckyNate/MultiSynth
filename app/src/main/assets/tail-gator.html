<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tail Gator</title><link rel="stylesheet" href="tail-gator.css"></head><body>
<main class="gator"><header><div><small>MULTISYNTH OUTPUT MODULE</small><h1>TAIL GATOR</h1></div><div id="lamp" class="lamp"></div></header>
<section class="tailgate"><div class="gatorTail" aria-hidden="true"><span></span></div><div><strong>CAR / EXTERNAL AUDIO</strong><p>Terminal output only. Arm it when you deliberately want the car or another external speaker path.</p></div></section>
<section class="levelDeck"><label class="toggleRow"><span><strong>NORMALIZE</strong><small>EVENS OUT QUIET PROGRAM LEVEL</small></span><input id="normalize" type="checkbox" checked></label><label class="liftRow" for="tailLift"><span><strong>TAIL LIFT</strong><small>OUTPUT MAKEUP</small></span><output id="tailLiftValue">160%</output></label><input id="tailLift" type="range" min="100" max="250" step="5" value="160"></section>
<section class="controls"><input id="armed" type="checkbox" hidden><input id="sinkId" type="text" hidden><button id="routeButton" type="button">ARM CAR OUT</button><button id="phoneButton" type="button">RETURN TO PHONE</button><div id="status">PHONE OUTPUT · CAR BLOCKED</div></section>
</main><script src="tail-gator.js"></script></body></html>
