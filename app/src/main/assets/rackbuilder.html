<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MultiSynth</title>
<link rel="stylesheet" href="rackbuilder.css">
<link rel="stylesheet" href="rack-grid-overview.css">
<link rel="stylesheet" href="rack-delete.css">
<link rel="stylesheet" href="rack-keyboard.css">
<link rel="stylesheet" href="rack-envelope.css">
<link rel="stylesheet" href="rack-garage-band.css">
<link rel="stylesheet" href="rack-master.css">
<link rel="stylesheet" href="rack-palettes.css">
</head>
<body>
<main class="rackApp">
    <section class="pinnedRackStage">
        <header class="topbar">
            <div class="brand">
                <div class="eyebrow">MULTISYNTH</div>
                <h1>RACK GRID</h1>
            </div>
            <button id="newRackBtn" type="button">+ RACK</button>
        </header>

        <section class="gridMasterScope">
            <div class="gridMasterScopeHead">
                <span>UNIFIED OUTPUT</span>
                <small>ALL TERMINAL RACKS</small>
            </div>
            <div class="gridMasterScopeBezel">
                <canvas id="gridMasterScope"></canvas>
            </div>
        </section>

        <section class="workspace">
            <aside class="rackListPanel">
                <div class="panelTitle">RACKS</div>
                <div id="rackList" class="rackList"></div>
            </aside>

            <section class="gridPanel">
                <div class="panelTitleRow">
                    <span>GRID</span>
                    <span class="hint">TWO FINGERS PAN / ZOOM · TAP RACK TO BUILD</span>
                </div>
                <div id="gridViewport" class="gridViewport">
                    <div id="rackGrid" class="rackGrid"></div>
                </div>
                <div class="legend">
                    <span>PARENT</span>
                    <span>SIBLING</span>
                    <span>CHILD</span>
                </div>
            </section>
        </section>
    </section>

    <section id="cascadePanel" class="cascadePanel rackBuilderPopup hidden">
        <div class="rackBuilderPopupCard">
            <div class="cascadeHeader">
                <div>
                    <div class="eyebrow">RACK BUILDER</div>
                    <h2 id="cascadeTitle">RACK</h2>
                    <div id="neighborhoodText" class="neighborhoodText"></div>
                </div>
                <div class="cascadeHeaderActions">
                    <button id="closeCascade" type="button">CLOSE</button>
                    <button id="deleteRackBtn" class="rackDeleteHeader" type="button" aria-label="Delete selected rack">×</button>
                </div>
            </div>
            <div class="rackBuilderPopupBody">
                <div id="cascadeList" class="cascadeList"></div>
                <button id="addModuleBtn" class="addModule" type="button">+ ADD COMPONENT</button>
                <div class="cascadeHint">TOP → BOTTOM IS SIGNAL ORDER · HOLD + DRAG TO REORDER</div>
            </div>
        </div>
    </section>

    <div id="moduleChooser" class="moduleChooser hidden">
        <div class="moduleChooserPanel">
            <div class="moduleChooserHead">
                <strong>ADD COMPONENT</strong>
                <button id="closeModuleChooser" type="button">CLOSE</button>
            </div>
            <div id="moduleChoices" class="moduleChoices"></div>
        </div>
    </div>

    <div id="moduleEditor" class="moduleEditor hidden">
        <div class="moduleEditorBar">
            <strong id="moduleEditorTitle">MODULE</strong>
            <button id="closeModuleEditor" type="button">BACK TO RACK</button>
        </div>
        <iframe id="moduleEditorFrame" title="Rack module editor"></iframe>
    </div>

    <div id="toast" class="toast"></div>
</main>

<section id="rackKeyboard" class="rackKeyboard">
    <div id="keyboardKeys" class="keyboardKeys"></div>
</section>

<!-- The rack project serializer owns rack/module persistence. Setting this guard prevents
     MainActivity's generic standalone-form autosaver from maintaining a second copy of
     the same rack controls under multisynth-autostate:* keys. -->
<script>window.__multiSynthAutoSave = true;</script>
<script src="module-contract.js"></script>
<script src="native-mic.js"></script>
<script src="clean-mic.js"></script>
<script src="pcm-library.js"></script>
<script src="modules/rhythm32-rack.js"></script>
<script src="modules/metronome-rack.js"></script>
<script src="modules/whitman-rack.js"></script>
<script src="modules/sample-chopper-rack.js"></script>
<script src="modules/granulator-rack.js"></script>
<script src="modules/envelope-rack.js"></script>
<script src="modules/garage-band-rack.js"></script>
<script src="modules/master-rack.js"></script>
<script src="modules/denzel-equalizer-rack.js"></script>
<script src="modules/carrier-synth-modules.js"></script>
<script src="modules/synth-gain-cleanup.js"></script>
<script src="modules/live-rack-modules.js"></script>
<script src="modules/hookworm-rack-tape.js"></script>
<script src="rack-engine.js"></script>
<script src="rack-audio-graph.js"></script>
<script src="rack-builder.js"></script>
<script src="rackbuilder-app.js"></script>
<script src="rack-grid-overview.js"></script>
<script src="rack-keyboard.js"></script>
<script src="rack-ui-controls.js"></script>
<script src="rack-editor-scope.js"></script>
</body>
</html>
