<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MultiSynth Rack Builder</title>
<link rel="stylesheet" href="rackbuilder.css">
</head>
<body>
<main class="rackApp">
<header class="topbar">
<a class="back" href="index.html">MULTISYNTH</a>
<div><div class="eyebrow">SPATIAL SYNTHESIS</div><h1>RACK BUILDER</h1></div>
<button id="newRackBtn" type="button">+ RACK</button>
</header>

<section class="workspace">
<aside class="rackListPanel">
<div class="panelTitle">RACKS</div>
<div id="rackList" class="rackList"></div>
</aside>

<section class="gridPanel">
<div class="panelTitleRow"><span>GRID</span><span class="hint">TAP TO EDIT · HOLD + DRAG TO MOVE</span></div>
<div id="gridViewport" class="gridViewport">
<div id="rackGrid" class="rackGrid" aria-label="Virtual rack grid"></div>
</div>
<div id="routeLegend" class="legend"><span>PARENT</span><span>SIBLING</span><span>CHILD</span></div>
</section>
</section>

<section id="cascadePanel" class="cascadePanel hidden">
<div class="cascadeHeader">
<div><div class="eyebrow">SELECTED RACK</div><h2 id="cascadeTitle">RACK</h2><div id="neighborhoodText" class="neighborhoodText"></div></div>
<button id="closeCascade" type="button">CLOSE</button>
</div>
<div id="cascadeList" class="cascadeList"></div>
<button id="addModuleBtn" class="addModule" type="button">+ ADD COMPONENT</button>
<div class="cascadeHint">TOP → BOTTOM IS SIGNAL ORDER · HOLD + DRAG TO REORDER</div>
</section>

<div id="toast" class="toast"></div>
</main>
<script src="module-contract.js"></script>
<script src="rack-engine.js"></script>
<script src="rack-builder.js"></script>
<script src="rackbuilder-app.js"></script>
</body>
</html>
