<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Unstable Diffusion</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;background:#050505;color:#eee;font-family:"Courier New",monospace}body{padding:12px;background:radial-gradient(circle at 50% 0,#242424,#050505 58%)}main{max-width:760px;margin:auto;border:2px solid #777;background:#080808;box-shadow:inset 0 0 40px #000,0 0 28px #fff1}.head{padding:16px;border-bottom:1px solid #555;background:repeating-linear-gradient(0deg,#111 0 2px,#090909 2px 4px)}.head small{letter-spacing:2px;color:#999}.head h1{margin:4px 0;font-size:clamp(28px,7vw,54px);letter-spacing:2px}.head p{margin:4px 0;color:#aaa;font-size:12px}.scope{height:120px;margin:12px;border:1px solid #666;background:#020202;position:relative}.scope canvas{width:100%;height:100%;display:block}.scope span{position:absolute;right:8px;bottom:6px;color:#999;font-size:9px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}.knob{min-height:118px;border:1px solid #555;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}.dial{width:64px;height:64px;border-radius:50%;border:2px solid #aaa;background:radial-gradient(circle at 38% 32%,#444,#111 55%,#050505);position:relative;box-shadow:inset 0 0 0 5px #080808,0 0 12px #fff1}.dial:after{content:"";position:absolute;width:3px;height:25px;left:50%;top:6px;background:#fff;transform-origin:50% 26px;transform:translateX(-50%) rotate(var(--rot,-135deg));box-shadow:0 0 5px #fff}.val{font-weight:700;margin-top:7px}.lab{font-size:9px;color:#aaa;text-align:center;margin-top:3px;letter-spacing:.5px}.record{margin:0 12px 14px;width:calc(100% - 24px);min-height:58px;border:2px solid #999;background:#151515;color:#fff;font:700 16px "Courier New",monospace;touch-action:none}.record.active{background:#eee;color:#000}.status{padding:0 12px 12px;color:#999;font-size:10px}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><header class="head"><small>MULTISYNTH · WAVEFORM RESOLUTION</small><h1>UNSTABLE DIFFUSION</h1><p>INCOMING SOURCE · WHITE-NOISE FALLBACK · LIVE RESOLUTION CONTROLS</p></header><section class="scope"><canvas id="scope"></canvas><span>OUTPUT</span></section><section id="grid" class="grid"></section><button id="record" class="record" type="button">HOLD RECORD</button><div id="status" class="status">READY</div></main><script>(()=>{const q=new URLSearchParams(location.search),instance=q.get('instance'),P=parent.MultiSynth||window.MultiSynth||{},E=P.NodeGraphEngine,D=P.ModuleBuilderDefinitions,C=P.ModuleContract,A=P.NodeAudioGraph;const model=D?.get?.('unstable-diffusion');if(!model||!instance||!E)return;let state={...model.defaults};try{state={...state,...(E.getModule(instance)?.state||{})}}catch(_){}const grid=document.getElementById('grid'),status=document.getElementById('status');const patch=p=>{state={...state,...p};try{E.setModuleState(instance,p);A?.rebuild?.()}catch(e){status.textContent=e?.message||'STATE ERROR'}};const controls=(model.controls||[]).filter(x=>['dial','knob'].includes(x.control)&&x.state&&x.value);for(const def of controls){const v=def.value,min=Number(v.min),max=Number(v.max),step=Number(v.step)||0.01,wrap=document.createElement('div'),dial=document.createElement('div'),val=document.createElement('div'),lab=document.createElement('div');wrap.className='knob';dial.className='dial';val.className='val';lab.className='lab';lab.textContent=def.label;wrap.append(dial,val,lab);grid.appendChild(wrap);let current=Number(state[def.state]??v.default??min);const paint=()=>{const n=Math.max(0,Math.min(1,(current-min)/(max-min||1)));dial.style.setProperty('--rot',(-135+n*270)+'deg');val.textContent=step<1?current.toFixed(step<=.01?2:1):Math.round(current)};const commit=()=>patch({[def.state]:current});paint();let pid=null,lastY=0;wrap.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;lastY=e.clientY;wrap.setPointerCapture?.(pid)});wrap.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();const dy=lastY-e.clientY;lastY=e.clientY;const span=max-min;current=Math.max(min,Math.min(max,current+dy*span/180));current=Math.round(current/step)*step;paint();commit()});const end=e=>{if(e.pointerId===pid)pid=null};wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end)}const rec=document.getElementById('record');let held=false;const start=e=>{e.preventDefault();if(held)return;held=true;rec.classList.add('active');rec.textContent='RECORDING — RELEASE';patch({recording:true});status.textContent='CAPTURING OUTPUT'};const stop=e=>{if(!held)return;e?.preventDefault?.();held=false;rec.classList.remove('active');rec.textContent='HOLD RECORD';patch({recording:false});status.textContent='SAVED TO PCM WHEN CAPTURE IS AVAILABLE'};rec.addEventListener('pointerdown',start);rec.addEventListener('pointerup',stop);rec.addEventListener('pointercancel',stop);window.addEventListener('pointerup',stop,true);const canvas=document.getElementById('scope'),ctx=canvas.getContext('2d');function draw(){const r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1),w=Math.max(2,Math.floor(r.width*dpr)),h=Math.max(2,Math.floor(r.height*dpr));if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;ctx.fillStyle='#020202';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();let a=null;try{a=C?.getAnalyser?.(instance)}catch(_){}ctx.strokeStyle='#eee';ctx.beginPath();if(a){let data=a.__udScope;if(!data||data.length!==a.fftSize)data=a.__udScope=new Float32Array(a.fftSize);a.getFloatTimeDomainData(data);for(let i=0;i<data.length;i++){const x=i/(data.length-1)*w,y=(.5-data[i]*.44)*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}}else{for(let x=0;x<w;x+=3){const y=h/2+(Math.random()-.5)*h*.16;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}}ctx.stroke();requestAnimationFrame(draw)}draw()})();</script></body></html>
