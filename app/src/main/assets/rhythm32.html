<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rhythm32</title><link rel="stylesheet" href="rhythm32.css"></head><body><header class="top"><canvas id="scope"></canvas><div class="title"><b>RHYTHM32</b><small>32-STEP DRUM SYNTH + SYNC</small></div></header><main><section class="transport"><label>BPM <input id="bpm" type="range" min="40" max="240" value="120"><output>120</output></label><label>SWING <input id="swing" type="range" min="0" max="70" value="0"><output>0</output></label><label>LENGTH <input id="steps" type="range" min="1" max="32" value="32"><output>32</output></label><label>CLICK <input id="clickLevel" type="range" min="0" max="0.5" step="0.01" value="0.14"><output>0.14</output></label><label>CLICK ON <input id="clockClick" type="checkbox" checked></label><button id="play">PLAY</button><button id="clear">CLEAR</button><button id="sync">SYNC: INTERNAL</button></section><section class="voiceEdit"><div><b id="voiceName">SUB</b><small id="voiceType">SYNTH VOICE</small></div><label>PITCH <input id="pitch" type="range" min="0" max="1000" step="1" value="176"><output></output></label><label>DECAY <input id="decay" type="range" min="20" max="4000" value="500"><output></output></label><label>BEND <input id="bend" type="range" min="-2400" max="2400" value="-900"><output></output></label><label>TONE <input id="tone" type="range" min="0" max="100" value="40"><output></output></label><label>CHARACTER <input id="character" type="range" min="0" max="100" value="50"><output></output></label><label>LEVEL <input id="voiceLevel" type="range" min="0" max="100" value="80"><output></output></label><button id="preview">HIT</button></section><section class="gridWrap"><div id="grid" class="grid" aria-label="32 step drum pattern"></div></section><p id="status">Pattern and voice parameters autosave.</p></main><script src="rhythm32.js"></script><script src="rhythm32-rack-bridge.js"></script><script src="always-save.js"></script></body></html>
