<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Garage Band</title><link rel="stylesheet" href="garage-band.css"><link rel="stylesheet" href="device-controls.css"></head><body><main class="panel"><header><div class="eyebrow">INLINE FILTER</div><h1>GARAGE BAND</h1><div class="rule"></div></header><section class="controls"><label>LOW<input id="low" type="range" min="-18" max="18" step="0.5" value="0"><output id="lowOut">0 dB</output></label><label>MID<input id="mid" type="range" min="-18" max="18" step="0.5" value="0"><output id="midOut">0 dB</output></label><label>HIGH<input id="high" type="range" min="-18" max="18" step="0.5" value="0"><output id="highOut">0 dB</output></label></section><footer>0 dB = PASS THROUGH</footer></main><script src="garage-band.js"></script><script src="direct-controls.js"></script></body></html>
