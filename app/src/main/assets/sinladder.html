<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SinLadder</title><link rel="stylesheet" href="sinladder.css"></head><body><main id="synth"><header class="scopePanel"><div class="scopeHeading"><span>SINLADDER // OUTPUT</span><span id="status">TOUCH TO START</span></div><canvas id="scope"></canvas></header><section id="channels" class="channelPanel"></section><section class="globalPanel"><div class="globalControl"><label for="attack">ATTACK</label><input id="attack" type="range" min="0.001" max="2" step="0.001" value="0.001"><output id="attack-value">1 ms</output></div><div class="globalControl"><label for="decay">DECAY</label><input id="decay" type="range" min="0.001" max="2" step="0.001" value="0.10"><output id="decay-value">100 ms</output></div><div class="globalControl"><label for="sustain">SUSTAIN</label><input id="sustain" type="range" min="0" max="1" step="0.01" value="0.75"><output id="sustain-value">75%</output></div><div class="globalControl"><label for="release">RELEASE</label><input id="release" type="range" min="0.001" max="3" step="0.001" value="0.25"><output id="release-value">250 ms</output></div><div class="globalControl"><label for="carrier">CARRIER LEVEL</label><input id="carrier" type="range" min="0" max="1" step="0.01" value="1"><output id="carrier-value">100%</output></div><div class="globalControl"><label for="master">MASTER</label><input id="master" type="range" min="0" max="1" step="0.01" value="0.35"><output id="master-value">35%</output></div><button id="panic" type="button">PANIC</button></section><section class="connectionPanel"><div class="panelTitle">CONNECTION</div><div id="connectionControls"></div></section><section id="keyboard" aria-label="Touch keyboard"></section></main><script src="sinladder.js"></script><script src="native-midi.js"></script><script src="always-save.js"></script></body></html>
