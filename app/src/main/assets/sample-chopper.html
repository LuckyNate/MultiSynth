<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sample Chopper</title><link rel="stylesheet" href="sample-chopper.css"></head><body><main><header><div class="eyebrow">MULTISYNTH · SAMPLE LIBRARY TOOL</div><h1>SAMPLE CHOPPER</h1><p>RECORD · MARK CUTS · SAVE PERMANENT PCM CHOPS</p></header><section class="screen"><canvas id="wave"></canvas><div id="status">NO CAPTURE</div></section><section class="controls"><div class="row"><button id="mic" class="hold">HOLD MIC</button><button id="rack" class="hold">HOLD RACK INPUT</button></div><label>NAME <input id="name" type="text" value="CHOP"></label><label>AUTO CHOPS <input id="count" type="range" min="1" max="32" step="1" value="8"><output id="countOut">8</output></label><div class="row"><button id="auto">AUTO CHOP</button><button id="clear">CLEAR CUTS</button></div><div class="row"><button id="save">SAVE CHOPS</button><button id="saveWhole">SAVE WHOLE</button></div></section><section class="library"><div class="libraryHead"><strong>PCM LIBRARY</strong><button id="refresh">REFRESH</button></div><div id="library"></div></section></main><script src="sample-chopper.js"></script></body></html>
