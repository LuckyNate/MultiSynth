<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PCM Editor</title><link rel="stylesheet" href="sample-editor.css"></head><body><main><h1>PCM EDITOR</h1><div id="status">SELECT A PCM SAMPLE</div><div id="library"></div><section id="controls"><label>LEVEL <input id="level" type="range" min="0" max="200" value="100"><output id="levelOut">100%</output></label><label>PITCH <input id="pitch" type="range" min="-24" max="24" step="1" value="0"><output id="pitchOut">0 ST</output></label><label>START <input id="start" type="range" min="0" max="99" step="1" value="0"><output id="startOut">0%</output></label><label>END <input id="end" type="range" min="1" max="100" step="1" value="100"><output id="endOut">100%</output></label><label>FADE IN <input id="fadeIn" type="range" min="0" max="1000" step="5" value="0"><output id="fadeInOut">0 MS</output></label><label>FADE OUT <input id="fadeOut" type="range" min="0" max="1000" step="5" value="0"><output id="fadeOutOut">0 MS</output></label><label class="toggle"><input id="reverse" type="checkbox"> REVERSE</label><div class="buttons"><button id="preview">PREVIEW EDIT</button><button id="save">SAVE AS NEXT</button></div></section></main><script src="sample-editor.js"></script></body></html>
