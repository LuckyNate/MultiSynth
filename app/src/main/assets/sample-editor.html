<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sample Surgery</title><link rel="stylesheet" href="sample-editor.css"><link rel="stylesheet" href="device-controls.css"></head><body><main><header class="surgeryHead"><div><small>MULTISYNTH · PCM OPERATING THEATRE</small><h1>SAMPLE SURGERY</h1><p>PRECISION PCM PREPARATION · NON-DESTRUCTIVE SAVE-AS</p></div><div class="caseLamp"><span></span>PATIENT READY</div></header><div id="status">SELECT A PATIENT FROM THE WARD</div><section class="monitor"><div class="monitorTop"><strong>PATIENT MONITOR</strong><span id="monitorReadout">NO SAMPLE</span></div><canvas id="waveform" width="1000" height="240"></canvas></section><section class="ward"><h2>PCM WARD · TAP TO AUDITION / ADMIT</h2><div id="library" class="deviceScreen"></div></section><section id="controls"><div class="controlGroup"><h2>INCISION / EXCISION</h2><label>START <input id="start" type="range" min="0" max="99" step=".1" value="0"><output id="startOut">0%</output></label><label>END <input id="end" type="range" min="1" max="100" step=".1" value="100"><output id="endOut">100%</output></label><div class="toolRow"><button id="silenceTrim">SILENCE TRIM</button><button id="zeroCross">ZERO-CROSS TRIM</button></div></div><div class="controlGroup"><h2>VITALS</h2><label>LEVEL <input id="level" type="range" min="0" max="200" value="100"><output id="levelOut">100%</output></label><label>PITCH <input id="pitch" type="range" min="-24" max="24" step="1" value="0"><output id="pitchOut">0 ST</output></label><div class="toolRow"><button id="normalize">NORMALIZE</button><button type="button" class="toggle" data-toggle-for="polarity">POLARITY FLIP</button><input id="polarity" type="checkbox" hidden></div></div><div class="controlGroup"><h2>SUTURES</h2><label>FADE IN <input id="fadeIn" type="range" min="0" max="1000" step="5" value="0"><output id="fadeInOut">0 MS</output></label><label>FADE OUT <input id="fadeOut" type="range" min="0" max="1000" step="5" value="0"><output id="fadeOutOut">0 MS</output></label><div class="toolRow"><button type="button" class="toggle" data-toggle-for="curve">CURVED FADES</button><input id="curve" type="checkbox" hidden><button type="button" class="toggle" data-toggle-for="reverse">REVERSE</button><input id="reverse" type="checkbox" hidden></div></div><div class="controlGroup"><h2>OBSERVATION</h2><div class="toolRow"><button type="button" class="toggle" data-toggle-for="loop">LOOP AUDITION</button><input id="loop" type="checkbox" hidden><button id="ab">A / B · ORIGINAL</button></div><div class="toolRow"><button id="undo">UNDO</button><button id="redo">REDO</button></div></div><div class="buttons"><button id="preview">AUDITION OPERATION</button><button id="save">DISCHARGE · SAVE AS NEXT</button></div></section></main><script>document.getElementById("loop").checked=false;</script><script src="sample-editor.js"></script><script>(function(){const buttons=[...document.querySelectorAll("button[data-toggle-for]")];for(const b of buttons){const input=document.getElementById(b.dataset.toggleFor);b.setAttribute("aria-pressed",input?.checked?"true":"false");b.onclick=()=>{if(!input)return;input.checked=!input.checked;input.dispatchEvent(new Event("change",{bubbles:true}))}}function sync(){for(const b of buttons){const input=document.getElementById(b.dataset.toggleFor),on=!!input?.checked;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on?"true":"false")}requestAnimationFrame(sync)}sync()})();</script><script src="direct-controls.js"></script></body></html>
