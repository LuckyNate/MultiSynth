<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Wire</title>
<link rel="stylesheet" href="control-surface.css">
<link rel="stylesheet" href="live-wire.css">
</head>
<body>
<main class="wire">
<header class="wireHead"><div class="bolt">ϟ</div><div class="brand"><small>MULTISYNTH SOURCE MODULE</small><h1>LIVE WIRE</h1></div><div id="lamp" class="lamp" aria-label="signal lamp"></div></header>
<section class="libraryScreen" aria-label="Freesound media library">
  <div class="libraryHead"><div><small>FREESOUND MEDIA LIBRARY</small><strong id="playingLabel">—</strong></div><span id="seekReadout">0:00 / 0:00</span></div>
  <audio id="player" preload="auto"></audio>
  <div class="libraryQueue">
    <div class="libraryRow current" role="button" tabindex="0" data-slot="current"><span>NOW</span><strong id="currentTitle">—</strong><small id="currentDuration">—</small></div>
    <div class="libraryRow" role="button" tabindex="0" data-slot="0"><span>01</span><strong id="queueLabel">—</strong><small id="queueDuration">—</small></div>
    <div class="libraryRow" role="button" tabindex="0" data-slot="1"><span>02</span><strong id="backup1">—</strong><small id="backup1Duration">—</small></div>
    <div class="libraryRow" role="button" tabindex="0" data-slot="2"><span>03</span><strong id="backup2">—</strong><small id="backup2Duration">—</small></div>
    <div class="libraryRow" role="button" tabindex="0" data-slot="3"><span>04</span><strong id="backup3">—</strong><small id="backup3Duration">—</small></div>
  </div>
</section>
<form id="searchForm" class="searchStrip" autocomplete="off"><div id="searchFieldHost"></div><div id="searchHost"></div></form>
<section class="seekPanel" aria-label="precision seek"><div class="seekCopy"><small>PRECISION SEEK</small><span>30 RPM · 1 REVOLUTION = 2 SECONDS</span></div><div id="seekHost" class="seekHost"></div></section>
<section id="transportHost" class="switchRow" aria-label="source controls"></section>
<div id="status" class="status">READY</div><div class="note">FREESOUND PREVIEWS · TAP A QUEUED SOUND TO LOAD IT</div>
</main>
<script src="control-surface-library.js"></script><script src="control-surface-spec.js"></script><script src="control-surface-renderer.js"></script>
<script>(()=>{const host=document.getElementById("searchFieldHost");if(!host)return;const input=document.createElement("input");input.id="search";input.type="search";input.inputMode="search";input.enterKeyHint="search";input.placeholder="SEARCH FREESOUND";input.setAttribute("aria-label","Search Freesound");host.appendChild(input)})();</script>
<script src="pcm-library.js"></script><script src="native-live-wire.js"></script><script src="live-wire.js"></script>
</body>
</html>
