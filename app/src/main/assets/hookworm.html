<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hookworm</title><link rel="stylesheet" href="hookworm.css"></head><body><header><b>HOOKWORM // CONTINUOUS TAPE LOOP</b><span id="status">STOPPED</span><canvas id="scope"></canvas></header><main><button id="start">START TAPE</button><section><label>LOOP LENGTH<input id="length" type="range" min="0.5" max="20" step="0.1" value="4"><output id="lengthOut">4.0 s</output></label><label>TAPE SPEED<input id="speed" type="range" min="0.25" max="4" step="0.01" value="1"><output id="speedOut">1.00×</output></label><label>ERASE / FALLOFF<input id="erase" type="range" min="0" max="1" step="0.01" value="1"><output id="eraseOut">100%</output></label><label>MIC THRESHOLD<input id="threshold" type="range" min="0.02" max="0.4" step="0.005" value="0.14"><output id="thresholdOut">14%</output></label></section><p>HEAD ORDER: PLAYBACK → ERASE → RECORD. Fresh input is written naturally at the current transport speed. Changing transport speed afterward bends previously recorded tape relative to the speed at which it was written. 100% erase gives one echo.</p></main><script src="native-mic.js"></script><script src="hookworm.js"></script></body></html>
