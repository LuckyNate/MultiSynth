<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PureSynth</title>
<link rel="stylesheet" href="puresynth.css">
</head>
<body>
<main id="synth">
    <header class="scopePanel">
        <div class="scopeHeading">
            <span>PURESYNTH // OUTPUT</span>
            <span id="status">TOUCH TO START</span>
        </div>
        <canvas id="scope"></canvas>
    </header>

    <section class="instrumentPanel">
        <div class="panelTitle">MATHEMATICALLY PURE SOURCE</div>
        <div id="waveforms" class="waveformGrid"></div>
        <div class="toneControls">
            <div class="globalControl">
                <label for="level">SOURCE LEVEL</label>
                <input id="level" type="range" min="0" max="1" step="0.01" value="0.8">
                <output id="level-value">80%</output>
            </div>
            <div id="pwmControl" class="globalControl disabled">
                <label for="pwm">SQUARE PWM</label>
                <input id="pwm" type="range" min="1" max="99" step="1" value="50" disabled>
                <output id="pwm-value">50%</output>
            </div>
            <div id="peakControl" class="globalControl disabled">
                <label for="peak">TRIANGLE PEAK</label>
                <input id="peak" type="range" min="0" max="100" step="1" value="50" disabled>
                <output id="peak-value">50%</output>
            </div>
        </div>
    </section>

    <section class="globalPanel">
        <div class="globalControl"><label for="attack">ATTACK</label><input id="attack" type="range" min="0.001" max="2" step="0.001" value="0.001"><output id="attack-value">1 ms</output></div>
        <div class="globalControl"><label for="decay">DECAY</label><input id="decay" type="range" min="0.001" max="2" step="0.001" value="0.10"><output id="decay-value">100 ms</output></div>
        <div class="globalControl"><label for="sustain">SUSTAIN</label><input id="sustain" type="range" min="0" max="1" step="0.01" value="0.75"><output id="sustain-value">75%</output></div>
        <div class="globalControl"><label for="release">RELEASE</label><input id="release" type="range" min="0.001" max="3" step="0.001" value="0.25"><output id="release-value">250 ms</output></div>
        <div class="globalControl"><label for="master">MASTER</label><input id="master" type="range" min="0" max="1" step="0.01" value="0.35"><output id="master-value">35%</output></div>
        <button id="panic" type="button">PANIC</button>
    </section>

    <section class="connectionPanel">
        <div class="panelTitle">CONNECTION</div>
        <div id="connectionControls"></div>
    </section>
    <section id="keyboard" aria-label="Touch keyboard">
        <div class="key white" data-note="48" style="width:6.666666666666667%;left:0%"></div>
        <div class="key black" data-note="49" style="width:4.266666666666667%;left:4.533333333333333%"></div>
        <div class="key white" data-note="50" style="width:6.666666666666667%;left:6.666666666666667%"></div>
        <div class="key black" data-note="51" style="width:4.266666666666667%;left:11.200000000000001%"></div>
        <div class="key white" data-note="52" style="width:6.666666666666667%;left:13.333333333333334%"></div>
        <div class="key white" data-note="53" style="width:6.666666666666667%;left:20%"></div>
        <div class="key black" data-note="54" style="width:4.266666666666667%;left:24.533333333333335%"></div>
        <div class="key white" data-note="55" style="width:6.666666666666667%;left:26.666666666666668%"></div>
        <div class="key black" data-note="56" style="width:4.266666666666667%;left:31.200000000000003%"></div>
        <div class="key white" data-note="57" style="width:6.666666666666667%;left:33.333333333333336%"></div>
        <div class="key black" data-note="58" style="width:4.266666666666667%;left:37.86666666666667%"></div>
        <div class="key white" data-note="59" style="width:6.666666666666667%;left:40%"></div>
        <div class="key white" data-note="60" style="width:6.666666666666667%;left:46.66666666666667%"></div>
        <div class="key black" data-note="61" style="width:4.266666666666667%;left:51.2%"></div>
        <div class="key white" data-note="62" style="width:6.666666666666667%;left:53.333333333333336%"></div>
        <div class="key black" data-note="63" style="width:4.266666666666667%;left:57.86666666666667%"></div>
        <div class="key white" data-note="64" style="width:6.666666666666667%;left:60%"></div>
        <div class="key white" data-note="65" style="width:6.666666666666667%;left:66.66666666666667%"></div>
        <div class="key black" data-note="66" style="width:4.266666666666667%;left:71.2%"></div>
        <div class="key white" data-note="67" style="width:6.666666666666667%;left:73.33333333333334%"></div>
        <div class="key black" data-note="68" style="width:4.266666666666667%;left:77.86666666666666%"></div>

        <div class="key white" data-note="71" style="width:6.666666666666667%;left:86.66666666666667%"></div>
        <div class="key white" data-note="72" style="width:6.666666666666667%;left:93.33333333333334%"></div>
    </section>
</main>
<script src="puresynth.js"></script>
<script src="native-midi.js"></script>
</body>
</html>
