<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alchemy Mixer</title><link rel="stylesheet" href="control-surface.css"><style>html,body{margin:0;min-height:100%;background:#25160c;color:#f1d7a6;font-family:system-ui,sans-serif}.alchemyEditor{padding:18px}.alchemyEditor h1{margin:0 0 4px;letter-spacing:2px}.status{margin:0 0 14px;opacity:.72;font-size:12px;letter-spacing:1px}.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.channel{min-width:0;padding:12px;border:2px solid #9a6734;border-radius:10px;background:#321d0e}.channelHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.channelHead strong{letter-spacing:1px}.channelHead small{font-size:9px;opacity:.65;letter-spacing:1px}.levelHost{min-height:170px}.muteHost,.soloHost{margin-top:8px}</style></head><body><main class="alchemyEditor"><h1>ALCHEMY MIXER</h1><div id="status" class="status"></div><div id="channels" class="channels"></div></main><script src="control-surface-library.js"></script><script src="control-surface-spec.js"></script><script src="control-surface-renderer.js"></script><script src="alchemy-mixer.js"></script></body></html>
