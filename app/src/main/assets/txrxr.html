<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TXRXR</title><style>html,body{margin:0;background:#101010;color:#f7f7e8;font-family:system-ui,sans-serif}main{padding:18px;border:4px solid #ffd400;min-height:100vh;box-sizing:border-box}h1{margin:0;color:#ffd400;letter-spacing:.16em}.sub,.hint{font-size:12px;letter-spacing:.08em;opacity:.78}.status,.identity{margin:14px 0;padding:12px;border:2px solid #ffd400;border-radius:10px;font-weight:900}.identity{font-size:20px}.parents{display:grid;gap:7px;margin:10px 0}button,input,select{font:inherit;padding:11px;background:#191919;color:#ffd400;border:2px solid #665800;border-radius:8px}button.active{background:#ffd400;color:#111}.patch{display:grid;grid-template-columns:42px 1fr 1fr;gap:8px;align-items:center;margin:8px 0}.parent{display:flex;justify-content:space-between;align-items:center}.parent button{width:100%;text-align:left}.empty{opacity:.55;padding:10px}</style></head><body><main><h1>TXRXR</h1><div class="sub">WIRELESS PATCH CABLE PORTING</div><div id="identity" class="identity">MY TX ID: —</div><div id="status" class="status">TX</div><button id="wireless">WIRELESS: ON</button><h2>PARENT TX</h2><div id="parents" class="parents"></div><section><h2>PATCHES</h2><div id="patches"></div><button id="add">+ PATCH</button></section><div class="hint">ANY TXRXR ABOVE YOU CAN BE A PARENT · RECEIVING NEVER STOPS THIS UNIT TRANSMITTING · RX FEEDS ALL DIRECT CHILDREN</div></main><script>(()=>{const q=new URLSearchParams(location.search),id=q.get('instance'),P=parent.MultiSynth||{},E=P.RackEngine,B=P.TXRXRBus;let rack=null,state={txId:null,parentTxIds:[],enabled:true,mappings:[]};for(const r of E?.graph?.().racks||[]){const m=r.modules?.find(x=>x.id===id);if(m){rack=r;state={...state,...m.state};break}}const patch=p=>{state={...state,...p};if(rack&&id)E.setModuleState(rack.id,id,p);draw()};const kinds=['audio','clock','dv','cv','note','automation'];function draw(){const d=B?.describe?.(id);if(d?.txId&&state.txId!==d.txId){state.txId=d.txId;if(rack&&id)E.setModuleState(rack.id,id,{txId:d.txId})}identity.textContent='MY TX ID: '+(d?.txId||state.txId||'—');status.textContent=(d?.parentTxIds?.length?'RX + TX':'TX')+' · '+(d?.wirelessChildren?.length||0)+' WIRELESS CHILD'+((d?.wirelessChildren?.length||0)===1?'':'REN');wireless.textContent='WIRELESS: '+(state.enabled===false?'OFF':'ON');wireless.classList.toggle('active',state.enabled!==false);parents.innerHTML='';const avail=d?.availableParents||[];if(!avail.length){const x=document.createElement('div');x.className='empty';x.textContent='NO TXRXR ABOVE';parents.append(x)}for(const p of avail){const on=(state.parentTxIds||[]).includes(p.txId),b=document.createElement('button');b.classList.toggle('active',on);b.textContent=(on?'● ':'○ ')+p.txId+'  ·  RACK '+p.position.row+','+p.position.col;b.onclick=()=>{const s=new Set(state.parentTxIds||[]);on?s.delete(p.txId):s.add(p.txId);patch({parentTxIds:[...s]})};parents.append(b)}patches.innerHTML='';(state.mappings||[]).forEach((m,i)=>{const d0=document.createElement('div');d0.className='patch';const on=document.createElement('button');on.textContent=m.enabled?'●':'○';on.classList.toggle('active',!!m.enabled);on.onclick=()=>{const a=[...state.mappings];a[i]={...a[i],enabled:!a[i].enabled};patch({mappings:a})};const s=document.createElement('select');for(const k of kinds)s.add(new Option(k.toUpperCase(),k));s.value=m.source||'audio';s.onchange=()=>{const a=[...state.mappings];a[i]={...a[i],source:s.value};patch({mappings:a})};const t=document.createElement('input');t.value=m.destination||m.source||'audio';t.placeholder='DESTINATION';t.onchange=()=>{const a=[...state.mappings];a[i]={...a[i],destination:t.value};patch({mappings:a})};d0.append(on,s,t);patches.append(d0)})}wireless.onclick=()=>patch({enabled:state.enabled===false});add.onclick=()=>patch({mappings:[...(state.mappings||[]),{enabled:false,source:'automation',destination:'level'}]});draw();setInterval(draw,750)})();</script></body></html>
