<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TXRXR</title><style>html,body{margin:0;background:#101010;color:#f7f7e8;font-family:system-ui,sans-serif}main{padding:18px;border:4px solid #ffd400;min-height:calc(100vh - 44px);box-sizing:border-box}h1{margin:0;color:#ffd400;letter-spacing:.16em}.sub{font-size:12px;letter-spacing:.12em}.status{margin:18px 0;padding:14px;border:2px solid #ffd400;border-radius:10px;font-weight:900}.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}button,input{font:inherit;padding:12px;background:#191919;color:#ffd400;border:2px solid #665800;border-radius:8px}button.active{background:#ffd400;color:#111}.patch{display:grid;grid-template-columns:42px 1fr 1fr;gap:8px;align-items:center;margin:8px 0}.patch button{padding:8px}.hint{opacity:.75;font-size:12px;margin-top:16px}</style></head><body><main><h1>TXRXR</h1><div class="sub">WIRELESS PATCH CABLE PORTING</div><div id="status" class="status">STANDBY</div><div class="row"><label>LINK <input id="linkId" maxlength="8" value="A"></label><button id="wireless">WIRELESS: ON</button></div><section><h2>PATCHES</h2><div id="patches"></div><button id="add">+ PATCH</button></section><div class="hint">SENIOR INSTANCE = TX · JUNIOR INSTANCE = RX · TX READS DIRECT PARENTS · RX FEEDS ALL DIRECT CHILDREN</div></main><script>(()=>{const q=new URLSearchParams(location.search),id=q.get('instance'),P=parent.MultiSynth||{},E=P.RackEngine,B=P.TXRXRBus;let rack=null,state={linkId:'A',enabled:true,mappings:[]};for(const r of E?.graph?.().racks||[]){const m=r.modules?.find(x=>x.id===id);if(m){rack=r;state={...state,...m.state};break}}const patch=p=>{state={...state,...p};if(rack&&id)E.setModuleState(rack.id,id,p);draw()};const kinds=['audio','clock','dv','cv','note','automation'];function draw(){linkId.value=state.linkId||'A';wireless.textContent='WIRELESS: '+(state.enabled===false?'OFF':'ON');wireless.classList.toggle('active',state.enabled!==false);const role=B?.role?.(id)||'standby';status.textContent=role.toUpperCase()+' · LINK '+(state.linkId||'A');patches.innerHTML='';(state.mappings||[]).forEach((m,i)=>{const d=document.createElement('div');d.className='patch';const on=document.createElement('button');on.textContent=m.enabled?'●':'○';on.classList.toggle('active',!!m.enabled);on.onclick=()=>{const a=[...state.mappings];a[i]={...a[i],enabled:!a[i].enabled};patch({mappings:a})};const s=document.createElement('select');for(const k of kinds)s.add(new Option(k.toUpperCase(),k));s.value=m.source||'audio';s.onchange=()=>{const a=[...state.mappings];a[i]={...a[i],source:s.value};patch({mappings:a})};const t=document.createElement('input');t.value=m.destination||m.source||'audio';t.placeholder='DESTINATION';t.onchange=()=>{const a=[...state.mappings];a[i]={...a[i],destination:t.value};patch({mappings:a})};d.append(on,s,t);patches.append(d)})}linkId.onchange=()=>patch({linkId:linkId.value.trim()||'A'});wireless.onclick=()=>patch({enabled:state.enabled===false});add.onclick=()=>patch({mappings:[...(state.mappings||[]),{enabled:false,source:'automation',destination:'level'}]});draw();setInterval(()=>{if(id)status.textContent=(B?.role?.(id)||'standby').toUpperCase()+' · LINK '+(state.linkId||'A')},500)})();</script></body></html>
