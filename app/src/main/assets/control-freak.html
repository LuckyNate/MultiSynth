<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Control Freak</title><link rel="stylesheet" href="control-freak.css"></head><body><main id="freak"><header><div><small>MULTISYNTH · PERFORMANCE CONTROL</small><h1>CONTROL FREAK</h1></div><div id="screen">READY</div></header><section class="upper"><div class="wheels"><div class="wheel"><label>PITCH</label><input id="pitch" type="range" min="-1" max="1" step=".01" value="0"></div><div class="wheel"><label>MOD</label><input id="mod" type="range" min="0" max="1" step=".01"></div></div><div><div class="pads" id="pads"></div><div class="transport"><button data-action="rew">◀◀</button><button data-action="stop">■</button><button data-action="play">▶</button><button data-action="rec">●</button><button id="octDown">OCT −</button><button id="octUp">OCT +</button><button id="panic">PANIC</button></div></div><div class="xy" id="xy"><span>XY</span><i id="xyDot"></i></div></section><section class="controls"><div id="knobs" class="knobs"></div><div id="faders" class="faders"></div></section><section class="ribbonWrap"><label>THEREMIN RIBBON · X = PITCH / ASSIGNABLE</label><div id="ribbon" class="ribbon"><i></i></div></section><section id="keyboard" class="keyboard"></section></main><script src="control-freak.js"></script></body></html>
