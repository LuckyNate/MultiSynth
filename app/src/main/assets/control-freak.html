<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Control Freak</title><link rel="stylesheet" href="control-freak.css"><link rel="stylesheet" href="console-fit.css"><link rel="stylesheet" href="control-surface.css"><link rel="stylesheet" href="control-performance-keyboard.css"></head><body><main id="freak"><div class="scrollBody"><header><div><small>MULTISYNTH · PERFORMANCE CONTROL</small><h1>CONTROL FREAK</h1></div><div id="screen">READY</div></header><section id="mapper" class="mapper hidden"><div class="mapperHead"><div><small>CONTROL FREAK · ASSIGN</small><h2 id="mapperTitle">MAP CONTROL</h2></div><button id="mapperClose" type="button">DONE</button></div><div class="mapperBar"><button id="mapperBack" type="button" disabled>CONTROL LIST</button><strong id="mapperPath">/ CONTROLS</strong></div><div id="mapperCurrent" class="mapperCurrent"></div><section id="mapperUnits" class="mapperUnits"></section><section id="mapperList" class="mapperList deviceScreen"></section></section><section class="upper"><div class="wheels"><div class="wheel" hidden aria-hidden="true"><label>LEGACY PITCH</label><input id="pitch" type="range" min="-1" max="1" step=".01" value="0" tabindex="-1"></div><div class="wheel assignable" data-map-key="mod"><label>MOD</label><input id="mod" type="range" min="0" max="1" step=".01"></div></div><div><div class="pads" id="pads"></div><div class="transport"><button data-action="rew">◀◀</button><button data-action="stop">■</button><button data-action="play">▶</button><button data-action="rec">●</button><button id="octDown" hidden aria-hidden="true" tabindex="-1">OCT −</button><button id="octUp" hidden aria-hidden="true" tabindex="-1">OCT +</button><button id="panic">PANIC</button></div></div><div class="xy" id="xy"><span>XY</span><i id="xyDot"></i><b class="mapBadge">HOLD X/Y TO MAP</b></div></section><section class="controls"><div id="knob
