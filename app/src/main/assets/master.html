<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Father Time</title><link rel="stylesheet" href="master.css"></head><body><main><header><div class="eyebrow">ANCIENT MASTER STAGE</div><h1>FATHER TIME</h1><p>PRE · GAIN · OVERDRIVE · LEVEL</p></header><section class="controls"><label>PRE<input id="pre" type="range" min="0" max="2" step="0.01" value="1"><output id="preValue">1.00×</output></label><label>GAIN<input id="gain" type="range" min="0" max="4" step="0.01" value="1"><output id="gainValue">1.00×</output></label><label>OVERDRIVE<input id="overdrive" type="range" min="0" max="1" step="0.01" value="0"><output id="overdriveValue">0%</output></label><label>LEVEL<input id="level" type="range" min="0" max="2" step="0.01" value="1"><output id="levelValue">1.00×</output></label></section><div class="note">UNITY PRE + UNITY GAIN + 0 DRIVE + UNITY LEVEL = CLEAN PASSTHROUGH</div></main><script src="master.js"></script></body></html>
