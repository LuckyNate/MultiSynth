<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Whitman Sampler</title>
<link rel="stylesheet" href="whitman.css">
</head>
<body>
<div id="app">
<header id="displayWrap"><div id="display"><div class="displayTop"><span>WHITMAN // 32 STEP PCM SAMPLER</span><span id="audioStatus">READY</span></div><canvas id="waveCanvas"></canvas><div class="displayBottom"><span id="selectedReadout">SAMPLE 01 // EMPTY</span><span id="timeReadout">0.000 s</span></div></div></header>
<main id="controls">
<section class="panel"><div class="panelTitle">SAMPLE BANK</div><div class="panelBody"><div id="sampleBank"></div><div class="buttonRow importRow"><button id="loadButton" class="button">LOAD AUDIO</button><button id="micButton" class="button">MIC RECORD</button><button id="clearSampleButton" class="button danger">CLEAR SAMPLE</button><input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.flac,.opus" hidden></div></div></section>
<section class="panel"><div class="panelTitle">SAMPLE</div><div class="panelBody controlGrid"><label class="control"><span>PITCH</span><input id="pitchSlider" type="range" min="-24" max="24" step="1" value="0"><output id="pitchValue">0 st</output></label><label class="control"><span>LEVEL</span><input id="sampleLevel" type="range" min="0" max="2" step="0.01" value="1"><output id="sampleLevelValue">100</output></label></div></section>
<section class="panel"><div class="panelTitle">CHOP</div><div class="panelBody controlGrid"><label class="control"><span>START</span><input id="startSlider" type="range" min="0" max="1" step="0.001" value="0"><output id="startValue">0.000</output></label><label class="control"><span>END</span><input id="endSlider" type="range" min="0" max="1" step="0.001" value="1"><output id="endValue">0.000</output></label><button id="previewButton" class="button large">PREVIEW</button></div></section>
<section class="panel"><div class="panelTitle">SPATIAL</div><div class="panelBody"><div class="spatialGrid"><label class="control"><span>LEFT LEVEL</span><input id="leftLevel" type="range" min="0" max="1" step="0.01" value="1"><output id="leftValue">100</output></label><label class="control"><span>RIGHT LEVEL</span><input id="rightLevel" type="range" min="0" max="1" step="0.01" value="1"><output id="rightValue">100</output></label><label class="control wide"><span>EAR LAG <small>L ← 0 → R</small></span><input id="lagSlider" type="range" min="-50" max="50" step="0.1" value="0"><output id="lagValue">0.0 ms</output></label></div><div class="buttonRow"><button id="spatialLock" class="button toggle">SPATIAL LOCK</button><button id="centerSpatial" class="button">CENTER</button></div></div></section>
<section class="panel"><div class="panelTitle">STEP BEHAVIOR</div><div class="panelBody"><div id="clipModes" class="clipModes"><button class="clipMode active" data-mode="none">NONE</button><button class="clipMode" data-mode="same">SAME</button><button class="clipMode" data-mode="other">OTHER</button><button class="clipMode" data-mode="any">ANY</button></div><div class="helpText">NONE lets every sample finish. SAME stops earlier copies of this sample. OTHER stops other samples. ANY stops all currently playing samples.</div></div></section>
<section class="panel"><div class="panelTitle">32 STEP SEQUENCER</div><div class="panelBody"><div id="stepGrid"></div><div class="transport"><button id="playButton" class="button transportButton">PLAY</button><button id="stopButton" class="button transportButton">STOP</button><button id="clearPatternButton" class="button transportButton danger">CLEAR</button><label class="tempo"><span>BPM</span><input id="bpmInput" type="number" min="20" max="300" step="1" value="120"></label></div></div></section>
<section class="panel"><div class="panelTitle">PATTERN MEMORY</div><div class="panelBody memoryPanel"><select id="patternSlot"><option value="0">PATTERN 01</option><option value="1">PATTERN 02</option><option value="2">PATTERN 03</option><option value="3">PATTERN 04</option><option value="4">PATTERN 05</option><option value="5">PATTERN 06</option><option value="6">PATTERN 07</option><option value="7">PATTERN 08</option></select><button id="savePatternButton" class="button">STORE</button><button id="loadPatternButton" class="button">RECALL</button></div></section>
</main></div>
<script src="whitman.js"></script>
<script src="whitman-persist.js"></script>
</body>
</html>
