<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Module Builder · MultiSynth</title><link rel="stylesheet" href="module-builder.css"></head><body><main><header><div><small>MULTISYNTH · MODULE TOOLING</small><h1>MODULE BUILDER</h1></div></header><section class="panel"><label>NAME<input id="name" value="New Module"></label><label>ID<input id="id" value="new-module"></label><label>CATEGORY<select id="category"><option>instrument</option><option>effect</option><option>generator</option><option>rhythm</option><option>sampler</option><option>utility</option><option>controller</option><option>clock</option><option>routing</option></select></label></section><section class="panel"><h2>FACEPLATE</h2><div id="faceplate" class="faceplate"></div><button id="addControl">+ CONTROL</button><small>DRAG TO POSITION · LONG PRESS A CONTROL TO OPEN ITS NODE</small></section><section class="panel"><h2>CAPABILITIES</h2><div id="capabilities" class="checks"></div></section><section id="nodePanel" class="panel hidden"><div class="nodeHead"><h2>NODE GRAPH</h2><button id="closeNodes" type="button">BACK TO FACEPLATE</button></div><div id="nodeFocus" class="nodeFocus"></div><div id="nodeGraph" class="nodeGraph"></div></section><section class="panel"><h2>MODULE SPEC</h2><pre id="preview"></pre><button id="saveDraft">SAVE DRAFT</button></section></main><script src="module-builder.js"></script></body></html>
