<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Module Builder Test</title><link rel="stylesheet" href="module-builder.css"></head><body><main><header><div><small>MODULE BUILDER</small><h1 id="title">TEST SHELL</h1></div><a href="module-builder.html">← BUILDER</a></header><section class="panel"><div id="meta"></div></section><section class="panel"><h2>CONTROLS</h2><div id="surface"></div></section></main><script>const s=JSON.parse(localStorage.getItem('multisynth.module-builder.current')||'{}');title.textContent=(s.displayName||'MODULE')+' · TEST';meta.textContent=(s.category||'module').toUpperCase()+' · '+(s.capabilities||[]).join(' · ');for(const c of s.controls||[]){const l=document.createElement('label');l.textContent=c.key.toUpperCase();const i=c.type==='toggle'?document.createElement('input'):c.type==='select'?document.createElement('select'):document.createElement('input');if(c.type==='toggle')i.type='checkbox';else if(c.type==='select'){i.innerHTML='<option>0</option><option>1</option>'}else{i.type='range';i.min=0;i.max=100;i.value=50}l.appendChild(i);surface.appendChild(l)}</script></body></html>
