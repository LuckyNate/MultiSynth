name: Build MultiSynth APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, restart/design-first ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Browser asset smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path("app/src/main/assets").resolve()
          missing = []
          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for attr in ("src", "href"):
                  for ref in re.findall(rf'{attr}=["\']([^"\']+)["\']', text):
                      if ref.startswith(("http:", "https:", "data:", "#", "javascript:")):
                          continue
                      local = ref.split("?", 1)[0].split("#", 1)[0]
                      if not local:
                          continue
                      target = (html.parent / local).resolve()
                      try:
                          target.relative_to(root)
                      except ValueError:
                          continue
                      if not target.exists():
                          missing.append(f"{html.relative_to(root)} -> {ref}")
          if missing:
              print("Missing local browser assets:")
              print("\n".join(missing))
              sys.exit(1)
          print("Browser asset smoke passed")
          PY

      - name: Architecture smoke
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            'RackEngine|RackAudioGraph|RackStandard|RackUI|RackUIPrefabs|RackUIBanks|graph\.racks|runtime\.rack|rt\.rack|api\.rack|MS\.rack|rackId|setRackValue|rack-ui-|nodeRackEditor|ModuleCompatibility' \
            app/src/main/assets app/src/main/java; then
            echo "Obsolete architecture or compatibility path found"
            exit 1
          fi
          echo "Architecture smoke passed"

      - name: Shared control CSS contract
        run: node scripts/audit-shared-control-ownership.mjs

      - name: Runtime smoke
        run: node tools/runtime-smoke.mjs

      - name: Prepare publishable signing key
        env:
          MULTISYNTH_KEYSTORE_B64: ${{ secrets.MULTISYNTH_KEYSTORE_B64 }}
          MULTISYNTH_KEYSTORE_PASSWORD: ${{ secrets.MULTISYNTH_KEYSTORE_PASSWORD }}
          MULTISYNTH_KEY_ALIAS: ${{ secrets.MULTISYNTH_KEY_ALIAS }}
          MULTISYNTH_KEY_PASSWORD: ${{ secrets.MULTISYNTH_KEY_PASSWORD }}
        run: |
          test -n "$MULTISYNTH_KEYSTORE_B64"
          test -n "$MULTISYNTH_KEYSTORE_PASSWORD"
          test -n "$MULTISYNTH_KEY_ALIAS"
          test -n "$MULTISYNTH_KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$MULTISYNTH_KEYSTORE_B64" | base64 -d > .signing/multisynth-release.jks
          keytool -list -keystore .signing/multisynth-release.jks -storepass "$MULTISYNTH_KEYSTORE_PASSWORD" -alias "$MULTISYNTH_KEY_ALIAS" >/dev/null
          echo "MULTISYNTH_KEYSTORE_PATH=${GITHUB_WORKSPACE}/.signing/multisynth-release.jks" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEYSTORE_PASSWORD=$MULTISYNTH_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEY_ALIAS=$MULTISYNTH_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEY_PASSWORD=$MULTISYNTH_KEY_PASSWORD" >> "$GITHUB_ENV"

      - run: gradle assembleDebug --stacktrace
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v6
        with:
          name: MultiSynth-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
