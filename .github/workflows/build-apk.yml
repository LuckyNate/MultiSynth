name: Build MultiSynth APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Android only accepts an APK as an update when it is signed by the same
      # certificate as the installed app. The cache now contains the established
      # MultiSynth development signing identity. Never silently generate another
      # key: if this cache is missing, fail the build instead of producing an APK
      # that would force users to uninstall and lose app-private data.
      - name: Restore MultiSynth update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: multisynth-android-debug-signing-v1
          fail-on-cache-miss: true

      - run: gradle assembleDebug --stacktrace
      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSynth-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
