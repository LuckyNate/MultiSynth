name: Build MultiSynth APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable MultiSynth development signing key
        run: |
          mkdir -p .signing
          base64 -d .github/multisynth-dev.keystore.b64 > .signing/multisynth-dev.jks
          keytool -list -keystore .signing/multisynth-dev.jks -storepass multisynth-dev -alias multisynth >/dev/null

      - run: gradle assembleDebug --stacktrace
      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSynth-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
