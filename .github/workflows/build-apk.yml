name: Build MultiSynth APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Generate patch notes from GitHub history
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          current = os.environ["CURRENT_SHA"]
          run_number = os.environ["RUN_NUMBER"]
          token = os.environ["GH_TOKEN"]

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/build-apk.yml/runs?branch=main&status=success&per_page=20",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          previous = None
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  runs = json.load(response).get("workflow_runs", [])
              for run in runs:
                  sha = run.get("head_sha")
                  if sha and sha != current:
                      previous = sha
                      break
          except Exception as exc:
              print(f"Patch-note baseline lookup failed: {exc}")

          if previous:
              subprocess.run(["git", "fetch", "--no-tags", "origin", previous], check=False)
              rev_range = f"{previous}..{current}"
          else:
              root = subprocess.check_output(["git", "rev-list", "--max-parents=0", current], text=True).splitlines()[0]
              rev_range = f"{root}..{current}"

          subjects = subprocess.check_output(
              ["git", "log", "--reverse", "--format=%s", rev_range], text=True
          ).splitlines()
          subjects = [s.strip() for s in subjects if s.strip()]
          if not subjects:
              subjects = [subprocess.check_output(["git", "show", "-s", "--format=%s", current], text=True).strip()]

          friendly_verbs = {
              "add": "Added", "fix": "Fixed", "update": "Updated", "replace": "Replaced",
              "remove": "Removed", "simplify": "Simplified", "register": "Registered",
              "wire": "Wired", "style": "Styled", "scale": "Scaled", "align": "Aligned",
              "make": "Made", "give": "Gave", "show": "Now showing", "generate": "Generated",
          }
          def friendly(subject):
              s = re.sub(r"^(feat|fix|chore|refactor|style|docs|test)(\([^)]*\))?:\s*", "", subject, flags=re.I).strip()
              parts = s.split(None, 1)
              if parts:
                  replacement = friendly_verbs.get(parts[0].lower())
                  if replacement:
                      s = replacement + (" " + parts[1] if len(parts) > 1 else "")
              if s:
                  s = s[0].upper() + s[1:]
              if s and s[-1] not in ".!?":
                  s += "."
              return s
          updates = [friendly(s) for s in subjects]
          lines = [
              "The MultiSynth Team made these updates just for you:",
              "",
              "Updates",
              *updates,
              "",
              "Thanks for playing with MultiSynth!",
              "Now go make some crazy noises!",
          ]

          note = {
              "id": f"build-{run_number}-{current[:12]}",
              "title": f"WHAT'S NEW · BUILD {run_number}",
              "lines": lines,
          }
          payload = "\"use strict\";\n(function(global){\n  global.MultiSynthReleaseNotes=Object.freeze([Object.freeze(" + json.dumps(note, ensure_ascii=False) + ")]);\n})(window);\n"
          Path("app/src/main/assets/release-notes.js").write_text(payload, encoding="utf-8")
          print(f"Generated {len(updates)} friendly patch note update(s) from GitHub history")
          if previous:
              print(f"Baseline successful build SHA: {previous}")
          else:
              print("No previous successful main build found; used repository history fallback")
          PY

      - name: Browser asset smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path("app/src/main/assets").resolve()
          missing = []
          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for attr in ("src", "href"):
                  for ref in re.findall(rf'{attr}=["\']([^"\']+)["\']', text):
                      if ref.startswith(("http:", "https:", "data:", "#", "javascript:")):
                          continue
                      local = ref.split("?", 1)[0].split("#", 1)[0]
                      if not local:
                          continue
                      target = (html.parent / local).resolve()
                      try:
                          target.relative_to(root)
                      except ValueError:
                          continue
                      if not target.exists():
                          missing.append(f"{html.relative_to(root)} -> {ref}")
          if missing:
              print("Missing local browser assets:")
              print("\n".join(missing))
              sys.exit(1)
          print("Browser asset smoke passed")
          PY

      - name: Architecture smoke
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            'RackEngine|RackAudioGraph|RackStandard|RackUI|RackUIPrefabs|RackUIBanks|graph\.racks|runtime\.rack|rt\.rack|api\.rack|MS\.rack|rackId|setRackValue|rack-ui-|nodeRackEditor|ModuleCompatibility' \
            app/src/main/assets app/src/main/java; then
            echo "Obsolete architecture or compatibility path found"
            exit 1
          fi
          echo "Architecture smoke passed"

      - name: Shared rotary smoke
        run: node tools/shared-rotary-smoke.mjs

      - name: Shared control CSS contract
        run: node scripts/audit-shared-control-ownership.mjs

      - name: Runtime smoke
        run: node tools/runtime-smoke.mjs

      - name: Prepare publishable signing key
        env:
          MULTISYNTH_KEYSTORE_B64: ${{ secrets.MULTISYNTH_KEYSTORE_B64 }}
          MULTISYNTH_KEYSTORE_PASSWORD: ${{ secrets.MULTISYNTH_KEYSTORE_PASSWORD }}
          MULTISYNTH_KEY_ALIAS: ${{ secrets.MULTISYNTH_KEY_ALIAS }}
          MULTISYNTH_KEY_PASSWORD: ${{ secrets.MULTISYNTH_KEY_PASSWORD }}
        run: |
          test -n "$MULTISYNTH_KEYSTORE_B64"
          test -n "$MULTISYNTH_KEYSTORE_PASSWORD"
          test -n "$MULTISYNTH_KEY_ALIAS"
          test -n "$MULTISYNTH_KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$MULTISYNTH_KEYSTORE_B64" | base64 -d > .signing/multisynth-release.jks
          keytool -list -keystore .signing/multisynth-release.jks -storepass "$MULTISYNTH_KEYSTORE_PASSWORD" -alias "$MULTISYNTH_KEY_ALIAS" >/dev/null
          echo "MULTISYNTH_KEYSTORE_PATH=${GITHUB_WORKSPACE}/.signing/multisynth-release.jks" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEYSTORE_PASSWORD=$MULTISYNTH_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEY_ALIAS=$MULTISYNTH_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MULTISYNTH_KEY_PASSWORD=$MULTISYNTH_KEY_PASSWORD" >> "$GITHUB_ENV"

      - run: gradle assembleDebug --stacktrace
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      - name: Rename APK with build number
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v6
        with:
          name: MultiSynth-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/MultiSynth-build-${{ github.run_number }}.apk
